name: Release

# Runs when a PR lands on main. The version comes from the VERSION file, so a
# release happens only when that file changes: merges that do not bump it are
# built and tested, then stop.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Format, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Tests
        run: go test -race ./...

  release:
    name: Build and release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        run: |
          version="$(cat VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$version already exists; nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.version.outputs.exists == 'false'
        run: |
          make dist VERSION="${{ steps.version.outputs.version }}" COMMIT="${{ github.sha }}"
          ls -lh dist/

      - name: Tag
        if: steps.version.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "hlw v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # Prefer the hand-written CHANGELOG entry for this version; fall back
          # to generated notes when the version has no section yet.
          notes=""
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
              capture && /^## \[/        { exit }
              capture                     { print }
            ' CHANGELOG.md > release-notes.md
            if [ -s release-notes.md ]; then
              notes="--notes-file release-notes.md"
              echo "Using CHANGELOG entry for $VERSION:"
              cat release-notes.md
            fi
          fi
          if [ -z "$notes" ]; then
            echo "::warning::No CHANGELOG entry for $VERSION; using generated notes."
            notes="--generate-notes"
          fi

          # shellcheck disable=SC2086
          gh release create "v${VERSION}" \
            --title "hlw v${VERSION}" \
            $notes \
            dist/*

      - name: Update Homebrew formula
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAP_REPO: first-it-consulting/homebrew-tap
        run: |
          set -euo pipefail

          # The formula builds from the source tarball, whose checksum only
          # exists once the tag does. GitHub can take a moment to generate it.
          url="https://github.com/${{ github.repository }}/archive/refs/tags/v${VERSION}.tar.gz"
          for attempt in 1 2 3 4 5; do
            if sha=$(curl -fsSL "$url" | shasum -a 256 | cut -d' ' -f1) && [ -n "$sha" ]; then
              break
            fi
            echo "Tarball not ready yet (attempt $attempt); retrying..."
            sleep 5
          done
          if [ -z "${sha:-}" ]; then
            echo "::error::Could not checksum $url"
            exit 1
          fi
          echo "v${VERSION} -> ${sha}"

          # Rewrite in place. Note: no "sed -i ''" here — that is BSD syntax,
          # and on the GNU sed this runner ships it swallows the expression as
          # a filename. Writing to a temp file is portable to both.
          rewrite() {
            sed -e "s|^  url \".*\"|  url \"${url}\"|" \
                -e "s|^  version \".*\"|  version \"${VERSION}\"|" \
                -e "s|^  sha256 \".*\"|  sha256 \"${sha}\"|" \
                "$1" > "$1.tmp"
            mv -f "$1.tmp" "$1"
          }

          rewrite Formula/hlw.rb
          grep -E '^  (url|version|sha256) ' Formula/hlw.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/hlw.rb
          if git diff --cached --quiet; then
            echo "Formula already current."
          else
            git commit -m "Bump hlw formula to ${VERSION}"
            # The checkout is detached on a push event, so name the branch.
            git push origin "HEAD:${{ github.ref_name }}"
          fi

          # Homebrew installs from the tap repo, not from this one: a tap's
          # name must start with "homebrew-", so this repo cannot serve as its
          # own tap. Mirror the formula across when a token is available.
          if [ -z "${TAP_TOKEN:-}" ]; then
            {
              echo "### Homebrew tap not updated"
              echo ""
              echo "No \`TAP_TOKEN\` secret is set, so \`${TAP_REPO}\` still serves the"
              echo "previous version. Copy \`Formula/hlw.rb\` across by hand, or add a"
              echo "token with \`contents: write\` on that repo."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::TAP_TOKEN not set; ${TAP_REPO} was left untouched."
            exit 0
          fi

          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          cp Formula/hlw.rb tap/Formula/hlw.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/hlw.rb
          if git diff --cached --quiet; then
            echo "Tap already current."
          else
            git commit -m "hlw ${VERSION}"
            git push
            echo "Pushed hlw ${VERSION} to ${TAP_REPO}." >> "$GITHUB_STEP_SUMMARY"
          fi
