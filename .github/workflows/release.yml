name: Release

# Runs when a PR lands on main. The version comes from the VERSION file, so a
# release happens only when that file changes: merges that do not bump it are
# built and tested, then stop.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Format, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Tests
        run: go test -race ./...

  release:
    name: Build and release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        run: |
          version="$(cat VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$version already exists; nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.version.outputs.exists == 'false'
        run: |
          make dist VERSION="${{ steps.version.outputs.version }}" COMMIT="${{ github.sha }}"
          ls -lh dist/

      - name: Tag
        if: steps.version.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "hlw v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # Prefer the hand-written CHANGELOG entry for this version; fall back
          # to generated notes when the version has no section yet.
          notes=""
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
              capture && /^## \[/        { exit }
              capture                     { print }
            ' CHANGELOG.md > release-notes.md
            if [ -s release-notes.md ]; then
              notes="--notes-file release-notes.md"
              echo "Using CHANGELOG entry for $VERSION:"
              cat release-notes.md
            fi
          fi
          if [ -z "$notes" ]; then
            echo "::warning::No CHANGELOG entry for $VERSION; using generated notes."
            notes="--generate-notes"
          fi

          # shellcheck disable=SC2086
          gh release create "v${VERSION}" \
            --title "hlw v${VERSION}" \
            $notes \
            dist/*

      - name: Update Homebrew tap
        if: steps.version.outputs.exists == 'false'
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          TAP_REPO: first-it-consulting/homebrew-tap
        run: |
          set -euo pipefail

          # The formula builds from the source tarball, whose checksum only
          # exists once the tag does. GitHub takes a moment to generate it.
          url="https://github.com/${{ github.repository }}/archive/refs/tags/v${VERSION}.tar.gz"
          sha=""
          for attempt in 1 2 3 4 5; do
            if sha=$(curl -fsSL "$url" | shasum -a 256 | cut -d' ' -f1) && [ -n "$sha" ]; then
              break
            fi
            echo "Tarball not ready yet (attempt $attempt); retrying..."
            sleep 5
          done
          if [ -z "$sha" ]; then
            echo "::error::Could not checksum $url"
            exit 1
          fi

          # Formula/hlw.rb.template is the single source of truth. Nothing
          # version-specific is committed to this repo, so the formula here can
          # never drift behind the tag, and nothing needs pushing to a
          # protected branch.
          sed -e "s|@URL@|${url}|" \
              -e "s|@VERSION@|${VERSION}|" \
              -e "s|@SHA256@|${sha}|" \
              Formula/hlw.rb.template > hlw.rb

          if grep -q '@[A-Z0-9_]*@' hlw.rb; then
            echo "::error::Unsubstituted placeholder left in the rendered formula:"
            grep -n '@[A-Z0-9_]*@' hlw.rb
            exit 1
          fi
          grep -E '^  (url|version|sha256) ' hlw.rb

          # Homebrew installs from the tap repo, not this one: a tap's name
          # must start with "homebrew-", so this repo cannot serve as its own.
          if [ -z "${TAP_DEPLOY_KEY:-}" ]; then
            {
              echo "### Homebrew tap not updated"
              echo ""
              echo "No \`TAP_DEPLOY_KEY\` secret is set, so \`${TAP_REPO}\` still serves"
              echo "the previous version. Commit this to its \`Formula/hlw.rb\`:"
              echo ""
              echo '```ruby'
              cat hlw.rb
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::TAP_DEPLOY_KEY not set; ${TAP_REPO} was left untouched."
            exit 0
          fi

          # A deploy key, not a PAT: it can write to the tap repository and
          # nothing else, so a leak cannot reach this repo or the org.
          key=$(mktemp)
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          trap 'rm -f "$key"' EXIT
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          git clone --depth 1 "git@github.com:${TAP_REPO}.git" tap
          cp hlw.rb tap/Formula/hlw.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/hlw.rb
          if git diff --cached --quiet; then
            echo "Tap already current."
          else
            git commit -m "hlw ${VERSION}"
            git push
            echo "Pushed hlw ${VERSION} to \`${TAP_REPO}\`." >> "$GITHUB_STEP_SUMMARY"
          fi
